<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CooperAI deck</title><style>body{margin:0;background:#1e1a15;color:#fffcf1;font:16px Arial,sans-serif}header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center}button,a{color:inherit;background:none;border:1px solid #777;padding:8px 12px;text-decoration:none;cursor:pointer}main{height:calc(100vh - 80px);display:grid;place-items:center}img{max-width:100%;max-height:100%;object-fit:contain}nav{display:flex;gap:10px;align-items:center}@media print{header{display:none}main{height:auto}img{width:100%}}</style><header><span>CooperAI deck</span><nav><button id="prev" aria-label="Previous slide">←</button><span id="count"></span><button id="next" aria-label="Next slide">→</button><button id="full">Full screen</button></nav></header><main><img id="slide" alt=""></main><script>let n=Math.max(1,Math.min(15,Number(location.hash.slice(1))||1));const titles=['Case study and demo presentation','Pre-call account context','Call Brief: Current State and Impact','Call Brief: Requirements and Evaluation','Problem – Opportunity – Wedge','MVP Scope','Architecture Decisions','System Architecture','Skill Design and AI Usage','Review and Exception Handling','Live Demonstration','Testing and Results','Evaluation and Acceptance','Scalability and Extensibility','Deployment and Next Steps'];function show(){document.querySelector('#slide').src='slide-'+String(n).padStart(2,'0')+'.png';document.querySelector('#slide').alt=titles[n-1];document.querySelector('#count').textContent=n+' / 15';location.hash=n;document.querySelector('#prev').disabled=n===1;document.querySelector('#next').disabled=n===15}function move(d){n=Math.max(1,Math.min(15,n+d));show()}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}});show();</script></html>
